# 정책 층 — **다섯 저장소가 같은 것을 묻는다**
#
# 각 저장소가 무엇을 만드는지는 다르다(프록시·메일·DNS·웹). 그건 저마다의 검증 층이
# 답한다. 반면 "자격증명이 이력에 들어왔는가", "워크플로 자체가 안전한가", "이 PR 이
# 무엇을 끌고 들어오는가" 는 **저장소가 무엇이든 같은 질문**이다. 그 층을 여기 한 벌 둔다.
#
# 부르는 쪽은 이렇게 쓴다.
#
#     jobs:
#       policy:
#         uses: henryj-dev/.github/.github/workflows/policy-checks.yml@<커밋 SHA>
#         permissions:
#           contents: read
#           pull-requests: write     # dependency-review 가 PR 에 이유를 적는다
#       gate:
#         needs: [..., policy]
#
# **재사용 워크플로는 부르는 저장소의 맥락에서 돈다.** 체크아웃도 그 저장소를 받고
# `.gitleaks.toml` 도 그쪽 것을 읽는다 — 예외 목록은 각 저장소가 자기 근거와 함께 갖는다.
#
# ⚠️ 부르는 쪽은 **반드시 커밋 SHA 로** 박는다. `@main` 은 움직이는 참조이고, 그러면 이
#    파일을 고치는 것만으로 다섯 저장소의 게이트가 동시에 바뀐다.
#
# 🔴 **"dependabot 이 SHA 를 갱신해 주므로 낡을 걱정은 없다" 고 적혀 있었고, 그건 사실이
#    아니다.** dependabot 은 `uses:` 로 부르는 **액션**은 갱신하지만, **태그도 릴리스도
#    없는 저장소의 재사용 워크플로 핀**은 갱신하지 못한다 — 이 저장소가 바로 그렇다.
#    tiny-universe/heliopause 에서 실측(2026-09-04): 핀은 사람이 박은 2026-08-26 이후
#    한 번도 움직이지 않았고, 08-29 의 상류 커밋이 그대로 남아 있었으며, dependabot 은
#    제안한 적이 없었다. 그래서 그 핀은 **사고로 영구해진 핀**이었다 — 리뷰된 것처럼
#    보이면서 그냥 멈춰 있는, 핀의 가장 나쁜 모양이다.
#
#    **태그를 끊기 전까지 그 줄은 손으로 움직인다.** 이 파일을 고쳤으면 부르는 다섯 곳에
#    알려야 한다: `gh api repos/henryj-dev/.github/commits/main --jq .sha`

name: policy checks

on:
  workflow_call:
    inputs:
      # 어느 러너에서 돌 것인가. 기본값은 GitHub 호스티드다 — 이 층은 저장소의 코드를
      # 빌드하지 않고 받아 온 바이너리로 읽기만 하므로, 일회용 VM 이 맞는 자리다.
      #
      # 입력인 이유: `runs-on` 은 **잡의 환경이 생기기 전에** 평가된다. 그래서 거기 쓴
      # `vars.*` 나 `env` 는 빈 문자열이 되고, 잡은 조용히 기본 러너로 간다 — 틀린 채로
      # 맞아 보인다(tiny-universe/heliopause 의 ci.yml 이 그 사고를 기록하고 있다).
      # 재사용 워크플로의 `inputs` 는 그 시점에 이미 있으므로 여기서만 성립한다.
      #
      # 문자열로 받아 `fromJSON` 으로 푸는 것은 YAML 에 배열 타입 입력이 없어서다.
      # 넘기는 쪽 예: `runner-labels: '["self-hosted","runner-01-ext-icn-vtr"]'`
      #
      # ⚠️ 자체 러너를 넘기는 것은 **공개 저장소에서는 하지 말 것.** 포크의
      #    `pull_request` 는 후보의 코드를 우리 기계에서 돌린다.
      runner-labels:
        description: '잡을 배정할 러너 라벨. JSON 배열 문자열. 예: ''["self-hosted","runner-01-ext-icn-vtr"]'''
        type: string
        required: false
        default: '["ubuntu-latest"]'
    secrets:
      # **이제 쓰지 않는다.** gitleaks-action 을 걷어 냈으므로 라이선스가 필요 없다.
      # 선언만 남기는 것은, 선언되지 않은 시크릿을 넘기면 재사용 워크플로 호출이
      # 시작부터 실패하기 때문이다 — 지금 부르는 여섯 곳이 모두 이 값을 넘긴다. 부르는 쪽이
      # 전부 `secrets:` 줄을 지운 뒤에 이 블록도 지운다.
      GITLEAKS_LICENSE:
        description: "쓰지 않는다. 기존 호출이 깨지지 않게 선언만 남겨 둔다"
        required: false

permissions:
  contents: read

jobs:
  # 자격증명이 이력에 들어왔는가. **지워진 커밋에 남은 것은 지워지지 않는다** —
  # 공개 저장소에서 한 번 밀린 값은 밀린 순간 이미 밖에 있다.
  secret-scan:
    name: secret scan
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 15
    # `tool-freshness.yml` 이 이 줄을 grep 해 최신 릴리스와 견준다. 올릴 때는
    # **버전과 SHA256 을 함께** 바꾼다 — 체크섬을 두면 받은 것이 무엇인지 우리가 정한다.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # **눈은 하나 — 이력 전체, 이벤트와 무관하게.** `git log --all` 범위라 push·PR·
      # 주기 실행 모두 받아 온 모든 ref 를 훑는다(PR 의 merge 커밋도 HEAD 로 들어간다).
      # 이벤트 범위만 보면 새 규칙이 붙어 어제까지 조용하던 옛 커밋이 오늘 걸리는 경우를
      # 놓친다.
      #
      # **전에는 gitleaks/gitleaks-action 이 하나 더 있었고, 걷어 냈다.** 그 액션은
      # 버전을 넘기지 않으면 gitleaks 8.24.3 을 받는데, 그 버전은 `.gitleaks.toml` 을
      # 읽었다고 로그에 적으면서도 **최상위 `[[allowlists]]`(복수, 8.25.0 에서 생김)를
      # 말없이 버린다.** 예외 목록이 통째로 사라진 채 초록/빨강이 정해졌다. parallax 의
      # 주기 실행에서 액션은 27건, 이 스텝은 0건을 냈고, f8eab73 에 박힌 ionosphere 와
      # lodestar 의 주기 실행은 9월 내내 같은 이유로 빨갰다 — 같은 이력, 같은 설정,
      # 다른 버전. 버전을 맞춰 넘겨도 남는 것은 같은 바이너리를 두 번 돌리는 일과,
      # 개인 계정이 아니면 요구하는 라이선스 시크릿뿐이었다.
      #
      # `--config` 를 못 박는 것은 자동 탐지에 맡기면 `.gitleaks.toml` 이 안 읽혀도 조용히
      # 통과하기 때문이다 — 그러면 예외가 아니라 검사가 사라진 것을 통과로 읽는다.
      # `.gitleaksignore` 는 작업 트리 루트에서 자동으로 읽는다. `--verbose` 는 걸린 것의
      # 규칙·파일·커밋을 로그에 남긴다(값은 `--redact` 가 가린다). 없으면 개수만 남는다.
      - name: gitleaks (이력 전체)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --verbose --exit-code 1 --config .gitleaks.toml .

  # **워크플로 자체가 공격면이다.** 러너는 밖에서 온 코드를 실행하고, `${{ }}` 가
  # `run:` 본문에 박히면 그게 곧 셸 코드가 된다. 사람은 리뷰에서 반드시 놓친다.
  workflow-audit:
    name: workflow audit
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
      - name: zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
          ZIZMOR_SHA256: "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839"
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o /tmp/zizmor.tgz "$url"
          echo "${ZIZMOR_SHA256}  /tmp/zizmor.tgz" | sha256sum -c -
          tar xzf /tmp/zizmor.tgz -C /tmp
          /tmp/zizmor --no-progress --persona=regular .github/workflows

  # **PR 이 무엇을 끌고 들어오는지 본다.** 잠금 파일을 그대로 세우는 설치는 새로 들어온
  # 패키지에 대해 아무 말도 하지 않는다 — 초록이 곧 "이 의존성이 괜찮다" 로 읽히는 자리다.
  dependency-review:
    name: dependency review
    # PR 에서만 뜻이 있다. 기준점이 있어야 "무엇이 새로 들어왔는가" 를 물을 수 있다.
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # `moderate` 부터 막으면 전이 의존성의 소음에 파묻힌다. 막는 선은
          # **되돌릴 수 없는 것**에 맞춘다.
          fail-on-severity: high
          # 카피레프트를 거부한다. 정말 필요한 것이 걸리면 여기서 예외를 다는 대신
          # **왜 필요한지를 PR 에 적고** 이 줄을 고친다.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure
