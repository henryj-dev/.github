# 룰셋 드리프트 — **정책은 만든 날이 아니라 유지되는 동안 값을 낸다**
#
# 다섯 저장소의 룰셋·저장소 설정·보안 기능을 한 벌로 세웠다. 그런데 그건 **한 번 한 일**
# 이고, 누가 UI 에서 하나를 고치면 조용히 갈라진다. GitHub 은 그때 아무 말도 하지 않는다.
#
# 여기서 `policy/baseline.json` 과 실물을 견준다. 막지 않는다 — 막을 수도 없다. 다만
# 갈라진 것이 **숫자와 이름으로 보이게** 한다.
#
# ⚠️ **토큰이 하나 필요하다.** 이 저장소의 `GITHUB_TOKEN` 은 자기 저장소 밖을 못 본다.
#    다른 저장소의 룰셋을 읽으려면 조직 읽기 권한이 있는 토큰을 `POLICY_READ_TOKEN`
#    시크릿으로 둬야 한다(fine-grained PAT: Administration=read, Metadata=read, 대상은
#    이 조직의 다섯 저장소). 없으면 이 워크플로는 **조용히 통과하지 않고 실패한다** —
#    "못 봤다" 를 "괜찮다" 로 읽지 않기 위해서다.

name: ruleset drift

on:
  schedule:
    - cron: "30 6 * * 1"   # 매주 월요일 06:30 UTC = 15:30 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 기준과 실물을 견준다
        id: diff
        env:
          GH_TOKEN: ${{ secrets.POLICY_READ_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::POLICY_READ_TOKEN 이 없다 — 다른 저장소의 룰셋을 읽을 수 없다."
            echo "::error::권한 없이 초록이 되면 '못 봤다'를 '괜찮다'로 읽게 된다. 여기서 멈춘다."
            exit 1
          fi

          base=policy/baseline.json
          drift=""
          note() { drift="${drift}- ${1}"$'\n'; echo "  ✗ ${1}"; }

          for repo in $(jq -r '.repos[]' "$base"); do
            echo "── $repo"
            full="$OWNER/$repo"

            # 저장소 설정
            got="$(gh api "repos/$full" --jq '{allow_merge_commit,allow_rebase_merge,allow_squash_merge,delete_branch_on_merge}')"
            want="$(jq -c '.settings' "$base")"
            for k in $(jq -r 'keys[]' <<<"$want"); do
              a="$(jq -r --arg k "$k" '.[$k]' <<<"$got")"
              b="$(jq -r --arg k "$k" '.[$k]' <<<"$want")"
              [ "$a" = "$b" ] || note "$repo · 설정 \`$k\`: $a (기준 $b)"
            done

            # 보안 기능
            sec="$(gh api "repos/$full" --jq '.security_and_analysis')"
            for k in $(jq -r '.security | keys[]' "$base"); do
              a="$(jq -r --arg k "$k" '.[$k].status // "없음"' <<<"$sec")"
              b="$(jq -r --arg k "$k" '.security[$k]' "$base")"
              [ "$a" = "$b" ] || note "$repo · 보안 \`$k\`: $a (기준 $b)"
            done

            # 옛 브랜치 보호가 되살아났는가 — 룰셋과 공존하면 둘 다 만족해야 하고,
            # 없어진 잡 이름을 들고 있으면 그 저장소는 영구 차단된다(2026-08-26 실사고).
            if gh api "repos/$full/branches/main/protection" >/dev/null 2>&1; then
              note "$repo · 옛 브랜치 보호가 다시 생겼다 (룰셋과 공존하면 영구 차단 위험)"
            fi

            # 룰셋
            rs="$(gh api "repos/$full/rulesets" --jq '[.[] | select(.name == "main")][0] // empty')"
            if [ -z "$rs" ]; then
              note "$repo · 룰셋 \`main\` 이 없다"
              continue
            fi
            id="$(jq -r '.id' <<<"$rs")"
            det="$(gh api "repos/$full/rulesets/$id")"

            enf="$(jq -r '.enforcement' <<<"$det")"
            [ "$enf" = "$(jq -r '.ruleset.enforcement' "$base")" ] || note "$repo · 룰셋 강제=$enf (기준 active)"

            byp="$(jq '.bypass_actors | length' <<<"$det")"
            [ "$byp" = "0" ] || note "$repo · 우회 액터 ${byp}개 (기준 0)"

            for t in $(jq -r '.ruleset.rule_types[]' "$base"); do
              jq -e --arg t "$t" '.rules[] | select(.type == $t)' <<<"$det" >/dev/null \
                || note "$repo · 규칙 \`$t\` 이 없다"
            done

            want_checks="$(jq -r --arg r "$repo" \
              '[.ruleset.required_status_checks[]] + ((.exceptions[$r].required_status_checks_extra) // []) | sort | join(",")' "$base")"
            got_checks="$(jq -r '[.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context] | sort | join(",")' <<<"$det")"
            [ "$want_checks" = "$got_checks" ] || note "$repo · required 체크: [$got_checks] (기준 [$want_checks])"

            strict="$(jq -r '[.rules[] | select(.type=="required_status_checks") | .parameters.strict_required_status_checks_policy][0]' <<<"$det")"
            [ "$strict" = "true" ] || note "$repo · strict(최신화 강제)=$strict (기준 true)"

            merges="$(jq -r '[.rules[] | select(.type=="pull_request") | .parameters.allowed_merge_methods[]] | sort | join(",")' <<<"$det")"
            [ "$merges" = "squash" ] || note "$repo · 허용 머지=[$merges] (기준 [squash])"
          done

          {
            echo "drift<<EOF"
            printf '%s' "$drift"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ -z "${drift//[$'\n\t ']/}" ] && echo "다섯 저장소 모두 기준과 같다" || true

      - name: 갈라진 것을 이슈로 남긴다
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.diff.outputs.drift }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="정책이 기준과 갈라졌다"
          num="$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
                   --json number --jq '.[0].number // empty')"

          if [ -z "${DRIFT//[$'\n\t ']/}" ]; then
            if [ -n "$num" ]; then
              gh issue close "$num" --repo "$REPO" --comment "기준과 다시 같아졌다."
              echo "닫았다: #$num"
            else
              echo "드리프트 없음 — 남길 것 없다"
            fi
            exit 0
          fi

          {
            echo '`policy/baseline.json` 과 실물이 다르다.'
            echo
            printf '%s' "$DRIFT"
            echo
            echo '의도한 변경이면 **기준 파일을 고쳐라** — 그래야 다음 주에 다시 뜨지 않고,'
            echo '무엇이 기준인지가 한 군데에 남는다. 의도치 않은 것이면 실물을 되돌려라.'
          } > /tmp/issue-body.md

          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$REPO" --body-file /tmp/issue-body.md
            echo "갱신했다: #$num"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file /tmp/issue-body.md
          fi
