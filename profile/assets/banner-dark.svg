<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="henryj-dev — declarative control planes for DNS, proxying, and firewalls">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="none" stroke="#30363d"/>

  <!-- orbital system -->
  <g transform="translate(955 150)">
    <circle r="135" fill="url(#glow)"/>
    <g fill="none" stroke="#58a6ff" stroke-opacity="0.32" stroke-width="1.25">
      <ellipse rx="132" ry="52" transform="rotate(-18)"/>
      <ellipse rx="104" ry="40" transform="rotate(26)"/>
      <ellipse rx="72"  ry="28" transform="rotate(-52)"/>
    </g>
    <circle r="11" fill="#58a6ff"/>
    <circle r="20" fill="none" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="1.25"/>
    <g transform="rotate(-18)"><circle cx="132" cy="0" r="6.5" fill="#bc8cff"/></g>
    <g transform="rotate(26)"><circle cx="-104" cy="0" r="5.5" fill="#58a6ff"/></g>
    <g transform="rotate(-52)"><circle cx="72" cy="0" r="4.5" fill="#58a6ff" fill-opacity="0.6"/></g>
  </g>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="106" fill="#8b949e" font-size="15" font-weight="600" letter-spacing="3.6">INFRASTRUCTURE CONTROL PLANES</text>
    <text x="80" y="180" fill="#e6edf3" font-size="62" font-weight="700" letter-spacing="-1.5">henryj-dev</text>
    <rect x="82" y="200" width="86" height="4" rx="2" fill="url(#rule)"/>
    <text x="80" y="242" fill="#8b949e" font-size="21" font-weight="450">Declarative desired state for DNS, proxying, and firewalls.</text>
  </g>
</svg>
